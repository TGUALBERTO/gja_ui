# Catálogo de componentes do framework Rebic (fonte da verdade).
#
# Mantido por toda change que cria, altera ou remove um item
# (spec rebic/spec-governance, requisito "Catálogo de componentes").
# Verificado por `dart run rebic_checks catalog`.
#
# Campos:
#   id          caminho da spec em openspec/specs/
#   name        nome público
#   kind        widget | foundation | core
#   category    kebab-case; para widgets, define lib/src/<categoria>/ em rebic_widgets
#   priority    P0 (núcleo mínimo) | P1 (essenciais) | P2 (dados) | P3 (avançados)
#   phase       fase de implementação (1 a 5)
#   status      planned | specified | implemented | deprecated
#   depends_on  ids das specs das quais o item depende (as dependências implícitas
#               de todo widget, theming, accessibility e RebicTheme, são omitidas)
#   proposed    true para itens adicionados além da lista original da solicitação
version: 1
